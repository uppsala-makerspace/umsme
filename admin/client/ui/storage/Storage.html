<template name="Storage">
  <section class="storage-dashboard">
    <div class="storage-heading"><div><h1>Storage</h1><p>Database-backed inventory and administrator-confirmed workflows.</p></div><button class="btn btn-default refresh-storage" disabled={{busy}}>Refresh</button></div>
    {{#unless operator}}<div class="alert alert-danger" role="alert"><strong>Not authorized.</strong> Storage is available to administrators and board members.</div>{{else}}
      {{#if loading}}<div class="alert alert-info" role="status">Loading storage state…</div>{{/if}}
      {{#if pageError}}<div class="alert alert-danger" role="alert">{{pageError}}</div>{{/if}}
      {{#with readiness}}<div class="storage-readiness storage-readiness-{{state}}" role="status"><strong>{{label}}</strong> {{detail}}{{#if reasons}}<ul>{{#each reason in reasons}}<li>{{reason}}</li>{{/each}}</ul>{{/if}}</div>{{/with}}

      <h2>Suggested actions</h2><p>Nothing is changed or sent until you review and confirm a batch.</p>
      <div class="storage-action-grid">{{#each card in actionCards}}<button class="storage-action-card open-preview" data-action={{card.id}} disabled={{card.disabled}}><span class="storage-action-count">{{card.count}}</span><strong>{{card.label}}</strong><small>{{card.help}}</small></button>{{/each}}</div>

      {{#if previewOpen}}<section class="storage-panel storage-preview">
        <div class="storage-heading"><div><h2>{{previewTitle}}</h2><p>Preview generated {{previewGenerated}}. Uncheck rows to exclude them.</p></div><button class="btn btn-link close-preview">Close</button></div>
        {{#if previewError}}<div class="alert alert-danger storage-inline-error" role="alert">{{previewError}}</div>{{/if}}
        {{#if previewBlocked}}<div class="alert alert-warning">Blocked by migration readiness. Resolve the listed issues and refresh.</div>{{/if}}
        {{#if previewEmpty}}<p>No actions are currently suggested.</p>{{/if}}
        {{#unless previewEmpty}}
          <table class="table table-condensed storage-table"><thead><tr><th>Include</th><th>Member</th><th>Unit</th><th>Reason</th><th>Date</th><th>Message / decision</th></tr></thead><tbody>{{#each row in previewRows}}<tr><td><input type="checkbox" class="select-suggestion" data-id={{row.suggestion_id}} checked={{row.selected}}></td><td>{{row.member_name}}</td><td>{{row.unit_name}}</td><td>{{row.reasonLabel}}{{#if row.phase}} (phase {{row.phase}}){{/if}}</td><td>{{row.date}}</td><td>{{row.channels}} {{#if row.allocationMove}}<label><input type="checkbox" class="requires-inspection" data-id={{row.suggestion_id}} checked={{row.requires_inspection}}> inspect old unit</label>{{/if}}{{#if row.expiredMove}}<select class="move-resolution" data-id={{row.suggestion_id}}><option value="">Choose…</option><option value="extend">Extend 14 days</option><option value="complete">Complete</option><option value="cancel">Cancel</option></select>{{/if}}{{#if row.reclamation}}<div class="storage-contact-evidence"><strong>{{row.warningContactLabel}}</strong>{{#if row.manual_contact_required}}<label><input type="checkbox" class="manual-contact-confirmed" data-id={{row.suggestion_id}} checked={{row.manual_contact_confirmed}}> I contacted this member manually</label><input type="text" class="manual-contact-reason" data-id={{row.suggestion_id}} value={{row.manual_contact_reason}} maxlength="5000" placeholder="How and when was contact made?">{{/if}}</div>{{/if}}</td></tr>{{/each}}</tbody></table>
        {{/unless}}
        <div class="storage-confirm-bar"><span>{{selectedCount}} selected. A fresh preview is checked before confirmation.</span><button class="btn btn-primary confirm-preview" disabled={{confirmDisabled}}>Confirm selected</button></div>
        {{#if batchResults}}<div aria-live="polite"><h3>Batch results</h3><p class="storage-result-summary">{{batchResultSummary}}</p><ul>{{#each result in batchResults}}<li class="storage-result-{{result.status}}"><strong>{{result.statusLabel}}</strong> {{result.label}} {{result.reason}}</li>{{/each}}</ul></div>{{/if}}
      </section>{{/if}}

      <section class="storage-panel storage-queue-panel">
        <div class="storage-heading"><div><h2>Storage queue</h2><p>Active allocation and different-unit requests, oldest first.</p></div><div class="storage-request-actions"><button class="btn btn-primary open-request-flow" data-mode="add">Add to queue</button><button class="btn btn-default open-request-flow" data-mode="move">Request different unit</button></div></div>
        {{#if queueError}}<div class="alert alert-danger storage-inline-error" role="alert">{{queueError}}</div>{{/if}}
        <div class="alert alert-info"><strong>No automatic notification.</strong> These manual request changes are audited, but administrators must contact the member separately.</div>
        <label class="storage-queue-search-label">Search queue members <input class="storage-queue-search" type="search" placeholder="Name, member number, or email" autocomplete="off"></label>
        {{#if storageQueue.length}}
          <div class="storage-queue-table-wrap"><table class="table table-condensed storage-table storage-queue-table"><thead><tr><th>Member</th><th>Waiting since</th><th>Request</th><th>Current unit</th><th>Preferences</th><th>Eligibility</th><th>Queue status</th><th>Actions</th></tr></thead><tbody>
            {{#each row in storageQueue}}<tr><td><strong>{{row.memberName}}</strong>{{#if row.memberNumber}}<br><small>{{row.memberNumber}}</small>{{/if}}</td><td>{{row.waitingSince}}</td><td>{{row.requestLabel}}</td><td>{{row.currentUnit}}</td><td>{{row.preferenceLabel}}</td><td><span class={{row.eligibilityClass}}>{{row.eligibilityLabel}}</span></td><td>{{row.pauseLabel}}</td><td class="storage-queue-row-actions">{{#if row.editable}}<button class="btn btn-xs btn-default edit-queue-preference" data-id={{row._id}}>Change preference</button>{{#if row.canTogglePause}}<button class="btn btn-xs btn-default toggle-request-pause" data-id={{row._id}} data-paused={{row.pauseTarget}}>{{row.pauseActionLabel}}</button>{{/if}}<button class="btn btn-xs btn-default correct-queue-date" data-id={{row._id}}>Correct waiting date</button><button class="btn btn-xs btn-danger cancel-request" data-id={{row._id}}>Cancel</button>{{else}}<small>Assignment in progress</small>{{/if}}</td></tr>{{/each}}
          </tbody></table></div>
        {{else}}<p>No members are currently waiting for storage.</p>{{/if}}

        {{#with requestEditor}}<form class="storage-form storage-request-editor request-goal-form">
          <div class="storage-form-wide storage-heading"><div><h3>{{title}}</h3><p>{{description}}</p></div><button class="btn btn-link close-request-editor">Close</button></div>
          <input name="request_id" type="hidden" value={{requestId}}><input name="request_type" type="hidden" value={{requestType}}>
          {{#if chooseMember}}<label>Member <input class="storage-member-picker" type="search" list="storage-members" placeholder="Search by name, member number, or email" autocomplete="off" required><input name="owner_id" type="hidden"></label>{{else}}<label>Member <input value="{{memberName}}" disabled><input name="owner_id" type="hidden" value={{ownerId}}></label>{{/if}}
          <label>Preferred floor <select name="floor"><option value="" selected={{floorAny}}>Any floor</option><option value="floor1" selected={{floor1}}>Floor 1</option><option value="floor2" selected={{floor2}}>Floor 2</option></select></label>
          <label>Preferred height <select name="height"><option value="" selected={{heightAny}}>Any height</option><option value="low" selected={{heightLow}}>Low</option><option value="high" selected={{heightHigh}}>High</option></select></label>
          {{#if waitingSince}}<p class="storage-form-wide">Current waiting date: <strong>{{waitingSince}}</strong>. Saving preferences alone preserves it.</p>{{/if}}
          <details class="storage-form-wide storage-advanced-request" open={{advancedOpen}}><summary>Advanced: correct waiting date</summary><div class="storage-form"><label>Corrected waiting date <input class="queue-date-correction" name="requested_at" type="date"></label><label>Required reason <input name="reason" maxlength="5000" placeholder="Why is the waiting date being corrected?"></label></div></details>
          <div class="storage-form-wide"><button class="btn btn-warning" disabled={{busy}}>{{submitLabel}} — no automatic notification</button></div>
        </form>{{/with}}
      </section>

      <section class="storage-panel">
        <div class="storage-heading"><div><h2>Walls</h2><p>Define the uniform columns and rows used by the storage layout.</p></div><button class="btn btn-default toggle-create-wall">Add wall</button></div>
        {{#if wallsError}}<div class="alert alert-danger storage-inline-error" role="alert">{{wallsError}}</div>{{/if}}
        {{#if createWallOpen}}<form class="storage-form create-wall-form"><label>Name <input name="name" required></label><label>Floor <select name="floor"><option value="floor1">Floor 1</option><option value="floor2">Floor 2</option></select></label><label>Display order <input name="display_order" type="number" min="1" required></label><label>Columns <input name="column_count" type="number" min="1" required></label><label>Rows <input name="row_count" type="number" min="1" required></label><label class="storage-form-wide">Internal note <textarea name="note"></textarea></label><button class="btn btn-primary" disabled={{busy}}>Create wall</button></form>{{/if}}
        <div class="storage-wall-editors">
          {{#each wall in storageWalls}}<details><summary><strong>{{wall.name}}</strong> · {{wall.column_count}} × {{wall.row_count}} · {{wall.unitCount}} unit(s){{#unless wall.active}} · inactive{{/unless}}</summary><form class="storage-form edit-wall-form" data-id={{wall._id}}><label>Name <input name="name" value={{wall.name}} required></label><label>Floor <select name="floor"><option value="floor1" selected={{wall.floor1}}>Floor 1</option><option value="floor2" selected={{wall.floor2}}>Floor 2</option></select></label><label>Display order <input name="display_order" type="number" min="1" value={{wall.display_order}} required></label><label>Columns <input name="column_count" type="number" min="1" value={{wall.column_count}} required></label><label>Rows <input name="row_count" type="number" min="1" value={{wall.row_count}} required></label><label class="storage-checkbox-label"><input name="active" type="checkbox" checked={{wall.active}}><span>Active</span></label><label class="storage-form-wide">Internal note <textarea name="note">{{wall.note}}</textarea></label><button class="btn btn-primary">Save wall</button></form></details>{{/each}}
        </div>
      </section>

      <section class="storage-panel">
        <div class="storage-heading"><div><h2>Inventory</h2><p>Placed by wall, column, and row. Status is conveyed by text and color.</p></div><button class="btn btn-default toggle-create-unit">Add unit</button></div>
        {{#if inventoryError}}<div class="alert alert-danger storage-inline-error" role="alert">{{inventoryError}}</div>{{/if}}
        {{#if createUnitOpen}}<form class="storage-form create-unit-form"><label>Name <input name="name" required></label><label>Height <select name="height"><option value="">Unclassified</option><option value="low">Low</option><option value="high">High</option></select></label><label>Wall <select name="wall_id" required>{{#each wall in activeWallOptions}}<option value={{wall._id}}>{{wall.name}}</option>{{/each}}</select></label><label>Column <input name="column" type="number" min="1" required></label><label>Row <input name="row" type="number" min="1" required></label><label>Status <select name="availability_status"><option value="available">Available</option><option value="unavailable">Unavailable</option></select></label><label class="storage-form-wide">Internal note <textarea name="note"></textarea></label><button class="btn btn-primary" disabled={{busy}}>Create unit</button></form>{{/if}}
        <div class="storage-filters"><label>Search <input class="storage-filter" data-filter="query" placeholder="name, wall or note"></label><label>Status <select class="storage-filter" data-filter="status"><option value="">All</option><option value="available">Available</option><option value="occupied">Occupied</option><option value="reserved">Reserved</option><option value="awaiting_clearance">Awaiting clearance</option><option value="unavailable">Unavailable</option></select></label><label>Floor <select class="storage-filter" data-filter="floor"><option value="">All</option><option value="floor1">Floor 1</option><option value="floor2">Floor 2</option></select></label><label>Height <select class="storage-filter" data-filter="height"><option value="">All</option><option value="unclassified">Unclassified</option><option value="low">Low</option><option value="high">High</option></select></label><label>Wall <select class="storage-filter" data-filter="wall"><option value="">All</option>{{#each wall in wallOptions}}<option value={{wall._id}}>{{wall.name}}</option>{{/each}}</select></label><label>Warning <select class="storage-filter" data-filter="warning"><option value="">All</option><option value="unwarned">Unwarned overdue</option><option value="warned">Warned</option><option value="exempt">Exempt</option></select></label><label class="storage-filter-checkbox"><input type="checkbox" class="storage-owner-filter"><span>Has owner</span></label><label class="storage-filter-checkbox"><input type="checkbox" class="storage-overdue-filter"><span>Overdue only</span></label></div>
        <div class="storage-bulk"><strong>Selected:</strong> <button class="btn btn-xs btn-default bulk-height" data-height="low">Set low</button> <button class="btn btn-xs btn-default bulk-height" data-height="high">Set high</button></div>
        {{#with bulkPending}}<div class="alert alert-warning storage-bulk-confirm" role="alert"><strong>Confirm bulk classification:</strong> set {{selectedCount}} unit(s) to {{height}}. {{protectedCount}} selected unit(s) are occupied or reserved.{{#if requiresAcknowledgement}}<label><input type="checkbox" class="bulk-acknowledgement"> I understand that occupied/reserved unit metadata will change.</label>{{/if}}<button class="btn btn-warning confirm-bulk-height" disabled={{confirmDisabled}}>Apply classification</button></div>{{/with}}
        {{#if bulkResults}}<div class="storage-bulk-results" aria-live="polite"><strong>Bulk result:</strong> {{bulkResultSummary}}<ul>{{#each result in bulkResults}}<li class="storage-result-{{result.statusClass}}"><strong>{{result.statusLabel}}</strong> {{result.label}} {{result.reason}}</li>{{/each}}</ul></div>{{/if}}
        <div class="storage-visual-legend" aria-label="Storage status legend"><span class="storage-status-available">Available</span><span class="storage-status-occupied">Occupied</span><span class="storage-status-reserved">Reserved</span><span class="storage-status-awaiting_clearance">Awaiting clearance</span><span class="storage-unit-overdue">Overdue</span><span class="storage-status-unavailable">Unavailable</span></div>
        {{#each wall in walls}}
          <h3>{{wall.name}}</h3>
          <div class="storage-visual-wall" aria-label="{{wall.name}} storage layout">
            {{#each column in wall.columns}}
              <div class="storage-visual-column" aria-label="Column {{column.number}}">
                {{#each unit in column.units}}
                  {{#if unit.empty}}<div class="storage-visual-unit storage-visual-empty" aria-label="Empty position, column {{unit.column}}, row {{unit.row}}"></div>{{else}}
                      <div class="storage-visual-unit {{unit.statusClass}} {{unit.overdueClass}} {{unit.selectedClass}}">
                        <input type="checkbox" class="bulk-unit" data-id={{unit._id}} checked={{unit.bulkSelected}} aria-label="Select {{unit.name}} for bulk edit">
                        <button class="select-unit" data-id={{unit._id}} title={{unit.tooltip}} aria-label="{{unit.tooltip}}"><strong>{{unit.name}}</strong>{{#unless unit.height}}<em>?</em>{{/unless}}</button>
                      </div>
                  {{/if}}
                {{/each}}
              </div>
            {{/each}}
          </div>
        {{/each}}
      </section>

      {{#with unitDetail}}<section class="storage-panel storage-unit-detail">
        <div class="storage-heading"><div><h2>Unit {{name}}</h2><p>{{statusLabel}} · {{ownerName}}</p></div>{{#if owner}}<a class="btn btn-link" href="/member/{{owner}}">Open member</a>{{/if}}</div>
        <div class="alert alert-info"><strong>No automatic notification.</strong> Every manual unit, assignment, exemption, move, and clearance action in this section is internal; contact the member separately when needed.</div>
        <form class="storage-form edit-unit-form" data-id={{_id}}><label>Name <input name="name" value={{name}} required></label><label>Height <select name="height"><option value="" selected={{heightNone}}>Unclassified</option><option value="low" selected={{heightLow}}>Low</option><option value="high" selected={{heightHigh}}>High</option></select></label><label>Wall <select name="wall_id" required>{{#each wall in wallChoices}}<option value={{wall._id}} selected={{wall.selected}} disabled={{wall.disabled}}>{{wall.choiceLabel}}</option>{{/each}}</select></label><label>Column <input name="column" type="number" min="1" value={{column}} required></label><label>Row <input name="row" type="number" min="1" value={{row}} required></label><label>Status <select name="availability_status"><option value="available" selected={{statusAvailable}}>Available</option><option value="unavailable" selected={{statusUnavailable}}>Unavailable</option>{{#if statusLifecycle}}<option value={{availability_status}} selected>{{statusLabel}} (unchanged)</option>{{/if}}</select></label><label class="storage-form-wide">Internal note <textarea name="note">{{note}}</textarea></label>{{#if metadataProtected}}<div class="storage-form-wide storage-metadata-warning"><label class="storage-checkbox-label"><input type="checkbox" name="acknowledged"><span>I confirm these physical metadata changes for this {{statusLabel}} unit.</span></label><small>Required because the unit is part of an active assignment or pending move.</small></div>{{/if}}<button class="btn btn-primary">Save metadata</button></form>
        {{#if clearance}}<button class="btn btn-warning confirm-clearance" data-id={{_id}}>Confirm physical clearance</button>{{/if}}
        {{#if assignable}}<form class="storage-inline-form manual-assign-form" data-id={{_id}}><label>Assign manually to member <input class="storage-member-picker" type="search" list="storage-members" placeholder="Search by name, member number, or email" autocomplete="off" required><input name="owner_id" type="hidden"></label><label><input name="override" type="checkbox"> override queue/eligibility</label><input name="reason" placeholder="Reason when overriding"><button class="btn btn-warning">Assign — no automatic notification</button></form>{{/if}}
        {{#with activeAssignment}}<div class="storage-subpanel"><h3>Active assignment</h3><p>Assigned {{assignedDate}}. <button class="btn btn-xs btn-danger end-assignment" data-id={{_id}}>End/correct</button></p>{{#if exemption}}<p>Exempt: {{exemption.reason}} <button class="btn btn-xs btn-default revoke-exemption" data-id={{exemption._id}}>Revoke</button></p>{{else}}<button class="btn btn-xs btn-default create-exemption" data-id={{_id}}>Add exemption</button>{{/if}}</div>{{/with}}
        {{#if canRequestRelease}}<button class="btn btn-warning request-release" data-owner={{owner}}>Request release — no automatic notification</button>{{/if}}
        {{#with activeRequest}}<div class="storage-subpanel"><h3>Active request</h3><p>{{request_type}} · {{request_status}} · {{requestedDate}}</p>{{#if canTogglePause}}<button class="btn btn-xs btn-default toggle-request-pause" data-id={{_id}} data-paused={{pauseTarget}}>{{pauseLabel}}</button>{{/if}} <button class="btn btn-xs btn-danger cancel-request" data-id={{_id}}>Cancel</button></div>{{/with}}
        {{#with pendingMove}}<div class="storage-subpanel"><h3>Pending move</h3><p>Deadline {{deadlineDate}}</p><button class="btn btn-xs btn-primary complete-move" data-id={{_id}}>Complete</button> <button class="btn btn-xs btn-default extend-move" data-id={{_id}}>Extend</button> <button class="btn btn-xs btn-danger cancel-move" data-id={{_id}}>Cancel</button></div>{{/with}}
        <div class="storage-subpanel"><h3>Storage messages</h3>{{#if messages.length}}<ul>{{#each item in messages}}<li>{{item.sentDate}} · {{item.subject}}</li>{{/each}}</ul>{{else}}<p>No automatic storage messages recorded for this owner.</p>{{/if}}</div>
        <div class="storage-subpanel"><h3>History</h3>{{#if history.length}}<ol class="storage-history">{{#each item in history}}<li><time>{{item.date}}</time> <strong>{{item.event_type}}</strong> {{item.reason}}</li>{{/each}}</ol>{{else}}<p>No recorded events.</p>{{/if}}</div>
      </section>{{/with}}

      <section class="storage-panel storage-event-log">
        <div class="storage-heading"><div><h2>Event log</h2><p>Read-only history of storage changes, newest first, up to 500 events.</p></div><button class="btn btn-default clear-storage-event-filters">Clear filters</button></div>
        <div class="storage-event-filters">
          <label>Member <input class="storage-event-filter" data-filter="member_id" type="search" list="storage-event-members" placeholder="Search by name, member number, or email" autocomplete="off"></label>
          <label>Storage unit <input class="storage-event-filter" data-filter="unit_id" type="search" list="storage-event-units" placeholder="Search by unit name" autocomplete="off"></label>
        </div>
        {{#if eventLogRows.length}}
          <div class="storage-event-table-wrap"><table class="table table-condensed storage-table storage-event-table"><thead><tr><th>When</th><th>Event</th><th>Member</th><th>Storage unit</th><th>Actor</th><th>Reason and details</th></tr></thead><tbody>
            {{#each row in eventLogRows}}<tr><td><time>{{row.date}}</time></td><td><strong>{{row.eventLabel}}</strong><br><small>{{row.entityLabel}}</small></td><td>{{#if row.memberId}}<a href="/member/{{row.memberId}}">{{row.memberLabel}}</a>{{else}}{{row.memberLabel}}{{/if}}</td><td>{{row.unitLabel}}</td><td>{{row.actorLabel}}</td><td>{{row.reason}}{{#if row.detailsLabel}}<details><summary>Details</summary><pre>{{row.detailsLabel}}</pre></details>{{/if}}</td></tr>{{/each}}
          </tbody></table></div>
        {{else}}<p>No events match these filters.</p>{{/if}}
      </section>

      <datalist id="storage-members">{{#each member in memberOptions}}<option value="{{member.pickerLabel}}" data-id="{{member._id}}"></option>{{/each}}</datalist>
      <datalist id="storage-event-members">{{#each member in eventMemberOptions}}<option value="{{member.pickerLabel}}" data-id="{{member._id}}"></option>{{/each}}</datalist>
      <datalist id="storage-event-units">{{#each unit in eventUnitOptions}}<option value="{{unit.name}}" data-id="{{unit._id}}"></option>{{/each}}</datalist>
    {{/unless}}
  </section>
</template>
