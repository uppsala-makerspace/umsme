<template name="UserView">
    <h1>User <small><a class="deleteUser">Delete</a></small></h1>
    {{#with linkedMember}}
    <div style="margin-bottom: 10px;">
        <a href="/member/{{_id}}">Member: {{name}}</a>
    </div>
    {{/with}}
    {{> quickForm collection=Users schema=userSchema doc=user id="userForm" omitFields="_id" type="update" buttonContent="Update user"}}
    {{#if isNotAdminUser}}
      {{#let admin=adminAsync board=boardAsync treasurer=treasurerAsync storage=storageAsync}}
        {{#if admin}}
          <button class="removeFromAdminGroup">Remove from admin group</button>
        {{/if}}
        {{#unless admin}}
          <button class="addToAdminGroup">Add to admin group</button>
        {{/unless}}
        {{#if board}}
          <button class="removeFromBoardGroup">Remove from board</button>
        {{/if}}
        {{#unless board}}
          <button class="addToBoardGroup">Add to board</button>
        {{/unless}}
        {{#if treasurer}}
          <button class="removeFromTreasurerGroup">Remove from treasurer</button>
        {{/if}}
        {{#unless treasurer}}
          <button class="addToTreasurerGroup">Add to treasurer</button>
        {{/unless}}
        {{#if storage}}
          <button class="removeFromStorageGroup">Remove from storage</button>
        {{/if}}
        {{#unless storage}}
          <button class="addToStorageGroup">Add to storage</button>
        {{/unless}}
      {{/let}}
    {{/if}}
    <div style="margin-top: 10px;">
        <label>New password: </label><input id="passwordReset" type="password" autocomplete="new-password">
        {{#if confirmingReset}}
        <button class="btn btn-warning btn-sm confirmResetPassword">Yes, set the new password</button>
        <button class="btn btn-default btn-sm cancelResetPassword">Cancel</button>
        {{else}}
        <button class="btn btn-default btn-sm resetPassword">Reset password</button>
        {{/if}}
        {{#if resetMessage}}
        <div class="alert alert-{{resetMessage.kind}}" style="margin-top: 8px;">{{resetMessage.text}}</div>
        {{/if}}
        <p class="help-block">Sets a new password for this user and logs them out everywhere.</p>
    </div>


    {{>CommentList about=id}}
</template>
