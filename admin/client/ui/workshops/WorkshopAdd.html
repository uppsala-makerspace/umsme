<template name="WorkshopAdd">
    <a href="/workshops" style="float: right">Back to workshops</a>
    <h1>Add workshop or area of interest</h1>
    <p class="text-muted">An area of interest (intresseområde) is coordinated around an interest that may span several workshops; it has lighter requirements than a workshop. The image is uploaded from the page after creation.</p>
    {{#autoForm collection=Workshops id="insertWorkshopForm" type="normal" validation="keyup"}}
        {{> afQuickField name="kind"}}
        {{#unless isAreaOfInterest}}
        <p class="text-muted">The Swedish name of a workshop should end in <em>verkstad</em> or <em>verkstaden</em> (e.g. Träverkstad, Träverkstaden).</p>
        {{/unless}}
        {{> afQuickField name="name.sv"}}
        {{> afQuickField name="name.en"}}
        {{> afQuickField name="description.sv"}}
        {{> afQuickField name="description.en"}}
        {{> afQuickField name="status"}}
        <div class="form-group">
            <label class="control-label">Responsible group (steering group)</label>
            <select class="form-control workshopGroupSelect">
                <option value="">(Select later)</option>
                {{#each workshopGroups}}
                <option value="{{_id}}">{{name.sv}}</option>
                {{/each}}
            </select>
        </div>
        {{> afQuickField name="slackChannel"}}
        {{> afQuickField name="guidesUrl"}}
        <button type="submit" class="btn btn-primary">Add</button>
    {{/autoForm}}
</template>
