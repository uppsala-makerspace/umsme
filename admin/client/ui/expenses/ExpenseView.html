<template name="ExpenseView">
    <a href="/expenses" style="float: right">Back to expenses</a>
    <h1>{{#if isInvoice}}Invoice{{else}}Expense{{/if}} <span class="label label-{{statusClass}}">{{statusText}}</span></h1>

    {{#if expense}}
    <div class="row">
        <div class="col-md-6">
            <table class="table table-condensed">
                <tbody>
                    <tr><th>Member</th><td><a href="/member/{{expense.memberId}}" target="_blank">{{memberName}}&nbsp;↗</a></td></tr>
                    <tr><th>Type</th><td>{{#if isInvoice}}<span class="label label-warning">Invoice</span> — the association pays the supplier{{else}}Receipt — reimburse the member{{/if}}</td></tr>
                    <tr><th>{{#if isInvoice}}Invoice date{{else}}Date{{/if}}</th><td>{{formatDate expense.date}}</td></tr>
                    {{#if isInvoice}}
                    <tr><th>Due date</th><td>{{#if expense.dueDate}}<strong>{{formatDate expense.dueDate}}</strong>{{else}}<em>—</em>{{/if}}</td></tr>
                    {{/if}}
                    <tr><th>Amount</th><td>{{#if expense.amount}}{{expense.amount}} kr{{else}}<em>—</em>{{/if}}</td></tr>
                    <tr><th>Account</th><td>{{accountName}}{{#if accountDimensions}} <small class="text-muted">[{{accountDimensions}}]</small>{{/if}}</td></tr>
                    <tr><th>{{#if isInvoice}}Supplier{{else}}Place{{/if}}</th><td>{{#if expense.place}}{{expense.place}}{{else}}<em>—</em>{{/if}}</td></tr>
                    <tr><th>Note</th><td>{{#if expense.note}}{{expense.note}}{{else}}<em>—</em>{{/if}}</td></tr>
                    <tr><th>Created</th><td>{{formatDate expense.createdAt}}</td></tr>
                    {{#if expense.bookkeepingAccount}}
                    <tr><th>Bookkeeping account</th><td><code>{{bookkeepingAccountLabel}}</code></td></tr>
                    {{/if}}
                    {{#if expense.reimbursedDate}}
                    <tr><th>{{#if isInvoice}}Payment date{{else}}Reimbursed date{{/if}}</th><td>{{formatDate expense.reimbursedDate}}</td></tr>
                    {{/if}}
                    <tr>
                        <th>{{#if isInvoice}}Pay to{{else}}Bank account{{/if}}</th>
                        <td>
                            {{#if isInvoice}}
                                <em>the supplier, using the payment details on the invoice</em>
                            {{else if hasBankAccount}}
                                {{#if bank.name}}<strong>{{bank.name}}</strong> — {{/if}}clearing <code>{{bank.clearing}}</code>, account <code>{{bank.number}}</code>
                                {{#if bank.holder}}
                                    <div style="margin-top: 4px;">account holder: <strong>{{bank.holder}}</strong></div>
                                {{/if}}
                                <div class="text-muted" style="margin-top: 4px;">
                                    combined: <code>{{bank.combined}}</code> <small>(verify format in your bank)</small>
                                </div>
                            {{else}}
                                <em>no bank account on file</em>
                            {{/if}}
                        </td>
                    </tr>
                </tbody>
            </table>

            {{#if expense.rejectionReason}}
            <div class="alert alert-warning">
                <strong>Rejection reason:</strong> {{expense.rejectionReason}}
            </div>
            {{/if}}

            <div class="btn-toolbar">
                {{#if isSubmitted}}
                <button class="btn btn-success confirmExpense">Confirm</button>
                <button class="btn btn-danger rejectExpense">Reject…</button>
                {{/if}}
                {{#if isConfirmed}}
                <button class="btn btn-danger rejectExpense">Reject…</button>
                {{/if}}
                {{#if isReimbursed}}
                <button class="btn btn-default unreimburseExpense">Undo "mark as {{#if isInvoice}}paid{{else}}reimbursed{{/if}}"</button>
                {{/if}}
            </div>

            {{#if isConfirmed}}
            <div class="panel panel-default" style="margin-top: 12px;">
                <div class="panel-body">
                    <div class="form-group">
                        <label for="reimburseAccount">Bookkeeping account</label>
                        <select id="reimburseAccount" class="form-control reimburseAccount">
                            <option value="">— select account —</option>
                            {{#each opt in accountOptions}}
                            <option value="{{opt.account}}" selected={{selectedAccount opt.account}}>{{opt.account}} — {{opt.name}}</option>
                            {{/each}}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reimburseDate">{{#if isInvoice}}Payment date{{else}}Reimbursement date{{/if}}</label>
                        <input type="date" id="reimburseDate" class="form-control reimburseDate" value="{{defaultReimburseDate}}">
                    </div>
                    <button class="btn btn-success reimburseExpense">Mark as {{#if isInvoice}}paid{{else}}reimbursed{{/if}}</button>
                </div>
            </div>
            {{/if}}

            {{#if rejecting}}
            <div class="panel panel-default" style="margin-top: 12px;">
                <div class="panel-body">
                    <label for="rejectReason">Reason for rejection (the member will see this)</label>
                    <textarea id="rejectReason" class="form-control rejectReason" rows="4"></textarea>
                    <div style="margin-top: 8px;">
                        <button class="btn btn-danger confirmReject">Reject expense</button>
                        <button class="btn btn-default cancelReject">Cancel</button>
                    </div>
                </div>
            </div>
            {{/if}}
        </div>

        <div class="col-md-6">
            {{#if receipt}}
                {{#if isPdf}}
                <a href="{{receipt}}" target="_blank" rel="noreferrer" class="btn btn-default btn-lg">Open PDF {{#if isInvoice}}invoice{{else}}receipt{{/if}}&nbsp;↗</a>
                {{else}}
                <img src="{{receipt}}" alt="Receipt" class="receiptThumb" style="max-width: 100%; border: 1px solid #ddd; cursor: zoom-in;" title="Click to enlarge">
                {{/if}}
            {{else}}
            <p class="text-muted">Loading receipt…</p>
            {{/if}}
        </div>
    </div>
    {{else}}
    <p>Expense not found.</p>
    {{/if}}

    {{#if receiptOpen}}
    <div class="receiptOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1050; overflow: auto; text-align: center;">
        <button class="closeReceipt btn btn-default" style="position: fixed; top: 15px; right: 15px; z-index: 1060;">Close ✕</button>
        <img src="{{receipt}}" alt="Receipt" class="receiptFull" style="{{receiptFullStyle}}">
    </div>
    {{/if}}
</template>
