<template name="ExpenseAccountView">
    <a href="/expenses/accounts" style="float: right">Back to expense accounts</a>
    <h1>Expense account: {{account.name}}</h1>

    {{#if isUsed}}
    <div class="alert alert-info">
        This account is used by one or more expenses and can no longer be deleted.
    </div>
    {{else}}
    <p><button class="btn btn-danger deleteExpenseAccount">Delete account</button></p>
    {{/if}}

    <h2>Edit</h2>
    {{#autoForm collection=ExpenseAccounts doc=account id="editExpenseAccountForm" type="update"}}
        {{> afQuickField name="name"}}
        {{> afQuickField name="explanation"}}
        <div class="form-group">
            <label class="control-label">Groups</label>
            <select class="form-control expenseAccountGroupSelect" multiple size="8">
                {{#each allGroups}}
                <option value="{{_id}}" {{groupSelected _id}}>{{name.sv}}</option>
                {{/each}}
            </select>
            <span class="help-block">The groups this account belongs to (ctrl/cmd-click for several).
                Their members may make expenses on it, and approvers are picked from them.
                {{#each accountGroups}}<a href="/group/{{_id}}">{{name.sv}}</a>&nbsp; {{/each}}
            </span>
        </div>
        {{#unless hasGroups}}
        <div class="alert alert-warning">No group selected — the guideline requires every account to belong to at least one group.</div>
        {{/unless}}
        {{> expenseAccountDimensions account=account}}
        <button type="submit" class="btn btn-primary">Update</button>
    {{/autoForm}}

    <hr>

    <h2>Budget</h2>
    <p class="text-muted">The budget for a calendar year. An expense counts towards the year of its receipt date.
        Revising adds a new entry; earlier ones are kept as history. Admin, board and treasurer may set it.</p>

    <div class="form-inline" style="margin-bottom: 15px">
        <label class="control-label" for="budgetYear">Year</label>
        <select id="budgetYear" class="form-control budgetYearSelect">
            {{#each budgetYears}}
            <option value="{{this}}" {{budgetYearSelected this}}>{{this}}</option>
            {{/each}}
        </select>
    </div>

    {{#if budget}}
    <p style="font-size: 1.6em"><strong>{{budget.amountText}}</strong>
        <small class="text-muted">in force since {{budget.dateText}}</small></p>
    {{else}}
    <p><em>No budget set for {{budgetYear}}.</em></p>
    {{/if}}

    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title">{{#if budget}}Revise budget{{else}}Set budget{{/if}} for {{budgetYear}}</h3>
        </div>
        <div class="panel-body">
            <form class="budgetForm">
                <div class="form-group">
                    <label class="control-label" for="budgetAmount">Budget (kr)</label>
                    <input id="budgetAmount" name="amount" type="number" min="0" step="0.01" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="control-label" for="budgetDate">Date</label>
                    <input id="budgetDate" name="setAt" type="date" class="form-control" value="{{today}}" required>
                </div>
                <div class="form-group">
                    <label class="control-label" for="budgetComment">Comment{{#if budget}} (required){{/if}}</label>
                    <textarea id="budgetComment" name="comment" rows="2" class="form-control" {{commentAttrs}}></textarea>
                </div>
                <button type="submit" class="btn btn-primary">{{#if budget}}Revise{{else}}Set{{/if}}</button>
            </form>
        </div>
    </div>

    {{#if budgetRevisions.length}}
    <table class="table table-condensed">
        <thead><tr><th>Date</th><th>Budget</th><th>Comment</th><th>Set by</th><th></th></tr></thead>
        <tbody>
        {{#each budgetRevisions}}
        <tr class="{{#if current}}info{{/if}}">
            <td>{{dateText}}</td>
            <td>{{amountText}}</td>
            <td>{{comment}}</td>
            <td>{{#if setBy}}<a href="/member/{{setBy}}">{{setByName}}</a>{{else}}<em>admin</em>{{/if}}</td>
            <td class="text-right" style="white-space: nowrap">
                {{#if isDeletingBudget _id}}
                <button class="btn btn-danger btn-xs confirmDeleteBudget" data-id="{{_id}}">Delete</button>
                <button class="btn btn-default btn-xs cancelDeleteBudget">Cancel</button>
                {{else}}
                <a class="deleteBudget text-danger" data-id="{{_id}}">Remove</a>
                {{/if}}
            </td>
        </tr>
        {{/each}}
        </tbody>
    </table>
    {{/if}}

    <hr>

    <h2>Expense approvers <small><a class="showApproverSelector">Add</a></small></h2>
    <p class="text-muted">Members who may approve expenses on this account (the guideline requires at least two).
        Only active members of the account's groups can be picked.
        Stored for the upcoming in-app approval flow; confirmation is still done here by admin/board for now.</p>

    {{#if showApproverSelector}}
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title">Add approver <a class="hideApproverSelector pull-right">Cancel</a></h3>
        </div>
        <div class="panel-body">
            {{#if hasGroups}}
                {{#if candidates.length}}
                <ul class="list-group">
                    {{#each candidates}}
                    <li class="list-group-item">
                        <a class="addApprover" data-id="{{_id}}">{{name}}</a>
                        <span class="text-muted pull-right">{{groupNames}}</span>
                    </li>
                    {{/each}}
                </ul>
                {{else}}
                <p><em>All active members of the account's groups are already approvers.</em></p>
                {{/if}}
            {{else}}
            <p><em>Select at least one group above (and save) before adding approvers.</em></p>
            {{/if}}
        </div>
    </div>
    {{/if}}

    {{#if hasApprovers}}
    <ul class="list-group">
        {{#each approvers}}
        <li class="list-group-item">
            <a href="/member/{{_id}}">{{name}}</a>
            <a class="removeApprover pull-right text-danger" data-id="{{_id}}">Remove</a>
        </li>
        {{/each}}
    </ul>
    {{#if tooFewApprovers}}
    <div class="alert alert-warning">Only one approver — the guideline requires at least two.</div>
    {{/if}}
    {{else}}
    <p><em>No approvers assigned.</em></p>
    {{/if}}
</template>
