<template name="ExpenseAccountAdd">
    <a href="/expenses/accounts" style="float: right">Back to expense accounts</a>
    <h1>Add expense account</h1>
    {{#autoForm collection=ExpenseAccounts id="insertExpenseAccountForm" type="normal" validation="keyup"}}
        {{> afQuickField name="name"}}
        {{> afQuickField name="explanation"}}
        <div class="form-group">
            <label class="control-label">Groups</label>
            {{#each allGroups}}
            <div class="checkbox">
                <label><input type="checkbox" class="expenseAccountGroupCheckbox" value="{{_id}}"> {{name.sv}}</label>
            </div>
            {{/each}}
            <span class="help-block">The groups this account belongs to; their members may make expenses on it.
                Groups can be changed and approvers added from the account page after creation.</span>
        </div>
        {{> expenseAccountDimensions}}
        <button type="submit" class="btn btn-primary">Add expense account</button>
    {{/autoForm}}
</template>
