<template name="ExpenseAccountAdd">
    <a href="/expenses/accounts" style="float: right">Back to expense accounts</a>
    <h1>Add expense account</h1>
    {{#autoForm collection=ExpenseAccounts id="insertExpenseAccountForm" type="normal" validation="keyup"}}
        {{> afQuickField name="name"}}
        {{> afQuickField name="explanation"}}
        {{> expenseAccountDimensions}}
        <button type="submit" class="btn btn-primary">Add expense account</button>
    {{/autoForm}}
</template>
