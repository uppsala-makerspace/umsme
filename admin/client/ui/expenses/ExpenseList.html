<template name="ExpenseList">
    <h1>{{heading}}</h1>
    {{#if split}}
    <div class="btn-group" role="group" style="margin-bottom: 1em">
        <button type="button" class="btn btn-default showQueue {{#unless showReimbursed}}active{{/unless}}">To reimburse or pay</button>
        <button type="button" class="btn btn-default showReimbursed {{#if showReimbursed}}active{{/if}}">Reimbursed</button>
    </div>
    {{#if showReimbursed}}
    {{> ReimbursedExpenses}}
    {{else}}
    <h2>Invoices to pay</h2>
    <p class="text-muted">Pay the supplier using the details on the invoice. Soonest due date first.</p>
    {{> tabular table=TabularTables.InvoicesToPay selector=invoiceSelector class="table table-hover table-striped table-bordered table-condensed expenseList"}}
    <h2>Receipts to reimburse</h2>
    {{> tabular table=TabularTables.Expenses selector=receiptSelector class="table table-hover table-striped table-bordered table-condensed expenseList"}}
    {{/if}}
    {{else}}
    {{#if filterable}}
    <form class="form-inline expenseFilters">
        <div class="form-group">
            <label for="expenseStatus">Status</label>
            <select class="form-control" id="expenseStatus" name="status">
                <option value="" selected={{selectedStatus ""}}>All</option>
                {{#each status in statuses}}
                <option value="{{status}}" selected={{selectedStatus status}}>{{status}}</option>
                {{/each}}
            </select>
        </div>
        <div class="form-group">
            <label for="expenseFrom">From</label>
            <input type="date" class="form-control" id="expenseFrom" name="from" value="{{filters.from}}">
        </div>
        <div class="form-group">
            <label for="expenseTo">To</label>
            <input type="date" class="form-control" id="expenseTo" name="to" value="{{filters.to}}">
        </div>
        {{#if filtered}}<button type="button" class="btn btn-default clearExpenseFilters">Clear filters</button>{{/if}}
    </form>
    {{/if}}
    {{> tabular table=TabularTables.Expenses selector=selector class="table table-hover table-striped table-bordered table-condensed expenseList"}}
    {{/if}}
</template>

<template name="ReimbursedExpenses">
    <p class="text-muted">Expenses reimbursed or set up for payment, by payment date. Leave To empty to include everything ahead.</p>
    <form class="form-inline reimbursedRange" style="margin-bottom: 1em">
        <div class="form-group">
            <label for="reimbursedFrom">From</label>
            <input type="date" class="form-control" id="reimbursedFrom" name="from" value="{{from}}">
        </div>
        <div class="form-group">
            <label for="reimbursedTo">To</label>
            <input type="date" class="form-control" id="reimbursedTo" name="to" value="{{to}}">
        </div>
    </form>
    {{#if rows.length}}
    <table class="table table-hover table-striped table-bordered table-condensed reimbursedList">
        <thead>
            <tr>
                <th>Payment date</th><th>Type</th><th>Member</th><th>Supplier / place</th><th>Account</th>
                <th class="text-right">Amount</th>
            </tr>
        </thead>
        <tbody>
            {{#each row in rows}}
            <tr data-id="{{row._id}}" style="cursor: pointer">
                <td>{{row.paymentDate}}</td>
                <td>{{#if row.invoice}}<span class="label label-warning">invoice</span>{{else}}receipt{{/if}}</td>
                <td>{{row.memberName}}</td>
                <td>{{row.place}}</td>
                <td>{{row.accountName}}</td>
                <td class="text-right">{{row.amountText}}</td>
            </tr>
            {{/each}}
        </tbody>
        <tfoot>
            <tr>
                <th colspan="5">Total, {{rows.length}} expenses</th>
                <th class="text-right">{{total}}</th>
            </tr>
        </tfoot>
    </table>
    {{else}}
    <p>No reimbursed expenses in this period.</p>
    {{/if}}
</template>
