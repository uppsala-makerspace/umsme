<template name="Revenue">
    <h1>Revenue</h1>
    <p class="revenue-intro">
        Membership payments only — every payment linked to a membership, counted
        in the month the money arrived and at the amount actually paid.
    </p>

    <div class="revenue-keyfigures">
        <div class="revenue-figure">
            <span class="revenue-figure-label">Last twelve months</span>
            <span class="revenue-figure-value">{{kr summary.trailingYear}}</span>
            <span class="revenue-figure-note">exactly one year back from today</span>
        </div>
        <div class="revenue-figure">
            <span class="revenue-figure-label">Current annual rate</span>
            <span class="revenue-figure-value">{{kr summary.level}}</span>
            <span class="revenue-figure-note">trend line at {{summary.lastCompleteMonth}}</span>
        </div>
        <div class="revenue-figure">
            <span class="revenue-figure-label">Growth</span>
            <span class="revenue-figure-value">{{kr summary.slopePerYear}}</span>
            <span class="revenue-figure-note">per year, {{kr summary.slope}} per month</span>
        </div>
    </div>

    <h2>All history</h2>
    <p class="revenue-caption">
        Revenue per month since {{summary.firstMonth}}, split by what was bought.
        The line is the trailing twelve-month sum on the right-hand axis, which is
        what the forecast below is fitted to.
    </p>
    <canvas id="revenuePerMonth"></canvas>

    <h2>Last twelve months, against the year before</h2>
    <p class="revenue-caption">
        Each month next to the same month a year earlier, so growth is readable
        month by month rather than through the trend line.
    </p>
    <canvas id="revenueYearOverYear"></canvas>

    <table class="table table-striped table-condensed revenue-table">
        <caption>Month by month against the year before</caption>
        <thead>
        <tr>
            <th>Month</th>
            <th class="revenue-number">Revenue</th>
            <th class="revenue-number">Year before</th>
            <th class="revenue-number">Change</th>
            <th class="revenue-number">%</th>
        </tr>
        </thead>
        <tbody>
        {{#each yearOverYear}}
            <tr>
                <td>{{month}}</td>
                <td class="revenue-number">{{kr total}}</td>
                <td class="revenue-number">{{#if hasPrevious}}{{kr previousYear}}{{else}}—{{/if}}</td>
                <td class="revenue-number {{signClass diff}}">{{#if hasPrevious}}{{signedKr diff}}{{else}}—{{/if}}</td>
                <td class="revenue-number {{signClass diff}}">{{#if hasPercent}}{{percentText percent}}{{else}}—{{/if}}</td>
            </tr>
        {{/each}}
        </tbody>
    </table>

    <h2>Per year</h2>
    <table class="table table-striped table-condensed revenue-table">
        <thead>
        <tr>
            <th>Year</th>
            {{#each categories}}<th class="revenue-number">{{label}}</th>{{/each}}
            <th class="revenue-number">Total</th>
            <th class="revenue-number">Growth</th>
        </tr>
        </thead>
        <tbody>
        {{#each yearly}}
            <tr class="{{#if incomplete}}revenue-incomplete{{/if}}">
                <td>{{year}}{{#if incomplete}} <span class="revenue-partial">so far</span>{{/if}}{{#if coversFrom}} <span class="revenue-partial">from {{coversFrom}}</span>{{/if}}</td>
                {{#each amounts}}<td class="revenue-number">{{kr this}}</td>{{/each}}
                <td class="revenue-number revenue-total">{{kr total}}</td>
                <td class="revenue-number {{signClass growth}}" title="{{growthTitle}}">
                    {{#if hasGrowth}}{{percentText growth}}{{else}}—{{/if}}
                </td>
            </tr>
        {{/each}}
        </tbody>
    </table>
    <p class="revenue-caption">
        Growth compares each year with the one before. {{currentYear}} is still
        running, so its figure compares the months elapsed this year with the
        same months last year — a part year against a whole one would read as a
        fall in the middle of a rise.
    </p>

    <h2>Forecast</h2>
    <p class="revenue-caption">
        Every row fits a straight line to the trailing twelve-month sum over the
        twelve points before the year it forecasts — not to the individual months,
        since membership revenue is strongly seasonal and a fit to monthly values
        slopes whichever way the window happens to open. Where that line stands is
        the annual rate; how steeply it rises is the <strong>trend per month</strong>
        column. <strong>Trend continues</strong> carries that row's own slope
        forward, <strong>level holds</strong> sets the slope to zero and keeps the
        rate where the line puts it, and a year still in progress counts the revenue
        already received and only models the rest.
    </p>
    <p class="revenue-caption">
        The two rows ahead share the fit made today: {{summary.fitMonths}} points
        ending {{summary.lastCompleteMonth}}, an annual rate of {{kr summary.level}}
        rising {{kr summary.slope}} a month. Each earlier row has its own,
        made at the time.
    </p>
    <table class="table table-striped table-condensed revenue-table">
        <thead>
        <tr>
            <th>Year</th>
            <th>Forecast from</th>
            <th class="revenue-number">Actual</th>
            <th class="revenue-number">Trend per month</th>
            <th class="revenue-number">Trend continues</th>
            <th class="revenue-number">Level holds</th>
        </tr>
        </thead>
        <tbody>
        {{#each forecastRows}}
            <tr class="{{#if partial}}revenue-incomplete{{/if}}">
                <td>{{year}}</td>
                <td class="revenue-madeat">{{#if madeAt}}{{madeAt}}{{else}}—{{/if}}</td>
                <td class="revenue-number">
                    {{#if hasActual}}{{kr actual}}{{#if partial}} <span class="revenue-partial">so far</span>{{/if}}{{else}}—{{/if}}
                </td>
                <td class="revenue-number">
                    {{#if hasForecast}}{{signedKr slope}}{{else}}—{{/if}}
                </td>
                <td class="revenue-number revenue-total">
                    {{#if hasForecast}}{{kr trend}}{{#if trendMiss}} <span class="revenue-miss">{{trendMiss}}</span>{{/if}}{{else}}—{{/if}}
                </td>
                <td class="revenue-number revenue-total">
                    {{#if hasForecast}}{{kr flat}}{{#if flatMiss}} <span class="revenue-miss">{{flatMiss}}</span>{{/if}}{{else}}—{{/if}}
                </td>
            </tr>
        {{/each}}
        </tbody>
    </table>
    <p class="revenue-caption">
        A finished year is forecast from the end of the year before, so the model
        never sees the year it is predicting. On this data both variants have come
        out consistently low — revenue has been compounding rather than climbing by
        a fixed amount, which a straight line cannot follow, and the trend per month
        has itself been climbing year on year. Read the two rows ahead as a floor
        rather than a best guess.
    </p>

    <p class="revenue-excluded">
        Not in the figures above:
        {{#each excluded}}<span class="revenue-excluded-item">{{label}} {{count}} ({{kr sum}})</span>{{/each}}
        Unclassified payments are the ones waiting for a treasurer to connect them
        to a membership under Payments → Manual.
    </p>
</template>
