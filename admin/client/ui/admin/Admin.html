<template name="AdminOneOffTools">
    {{#if currentUser}}
        <h2>One-off tools</h2>
        <p class="text-muted">Tools for moving old data into shape, kept here on the old page until it is decided which of them stay (see plan/open-questions.md).</p>
        <h3>Migrate legacy unlocks to doorunlocks</h3>
        <p class="text-muted">Copies every row in the legacy <code>unlocks</code> collection into <code>doorunlocks</code> and then empties <code>unlocks</code>. Re-runnable: rows already in <code>doorunlocks</code> are skipped. Usernames that don't match a member's email are stored in an <code>extid</code> field instead of <code>memberid</code>.</p>
        <button class="migrateUnlocks btn btn-primary">Migrate now</button>

        <h3>Update members with correct dates</h3>
        <button class="updateMembers">Update now!</button>
        <h3>Detect mobile numbers in payments</h3>
        <button class="detectMobiles">Detect now!</button>
        <h3>Update member mobile numbers from payments </h3>
        <button class="updateMobiles">Update now!</button>

        <h3>Accept all current paying members</h3>
        <p class="text-muted">Sets all paying members (not family dependents) as registered. Use this to avoid having to individually accept all existing members.</p>
        <button class="acceptAllMembers btn btn-primary">Accept all</button>

        <h3>Lowercase member emails</h3>
        <p class="text-muted">Rewrites every member's <code>email</code> field to lowercase so user-to-member lookups stop missing on case mismatches. Skips members whose lowercased email would collide with another existing member.</p>
        <button class="lowercaseMemberEmails btn btn-primary">Lowercase now</button>

    {{/if}}
</template>
